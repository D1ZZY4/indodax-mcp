name: Lint

# DATABASE_URL below points at an ephemeral Postgres service container, not a
# secret and not a real database. It exists only because the embedded
# Postgres binary cannot start on ubuntu-latest (missing libicuuc.so.60).
# The db suite prefers DATABASE_URL and falls back to embedded Postgres
# locally. Apps still run without DATABASE_URL via in-memory fallbacks.

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bunx turbo typecheck
      - run: bunx turbo test
      - run: bunx turbo build

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bunx turbo build
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test

  consumer:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bunx turbo build
      - run: bun run release:dry
      - run: bun run verify:consumer

  migrate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun --filter @indodax-mcp/db db:generate
      - name: Fail when generated migration drifts from schema
        run: git diff --exit-code -- packages/db/drizzle
