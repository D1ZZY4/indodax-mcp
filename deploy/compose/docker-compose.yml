services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: indodax
      POSTGRES_PASSWORD: indodax
      POSTGRES_DB: indodax
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  mcp-http:
    build: ../..
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://indodax:indodax@postgres:5432/indodax
    depends_on: ["postgres"]

volumes:
  pgdata:
